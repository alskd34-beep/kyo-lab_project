# main 에 push 되면 Railway 로 자동 배포한다.
#
# Railway 의 GitHub 네이티브 연동을 쓰지 않는 이유:
#   이 저장소는 Railway 계정(alskd34@gmail.com)과 다른 GitHub 계정 소유라,
#   Railway GitHub App 을 저장소 소유 계정에 설치할 수 없다.
#   토큰 방식은 저장소 소유자와 무관하게 동작한다.
#
# ⚠️ Secret 이름은 RAILWAY_TOKEN 인데 환경변수는 RAILWAY_API_TOKEN 이다. 오타가 아니다 —
#    account/tokens 에서 만든 계정 토큰은 RAILWAY_API_TOKEN 으로 읽어야 하고
#    (RAILWAY_TOKEN 은 프로젝트 토큰 전용이라 Invalid 로 거부된다),
#    Secret 은 값을 다시 읽을 수 없어 이름만 그대로 두었다.

name: Deploy to Railway

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

# 배포가 겹치면 나중 것만 살린다. 크론이 도는 단일 인스턴스라 동시 배포가 의미 없다.
concurrency:
  group: railway-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --ci \
            --project e1bbd8a0-e14b-4f7b-8c60-4b64bbd80a58 \
            --environment production \
            --service kyo-app \
            --message "GitHub Actions: ${{ github.sha }}"
